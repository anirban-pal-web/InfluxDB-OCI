---
- name: Remove any old Influx repo
  file:
    path: /etc/apt/sources.list.d/influxdata.list
    state: absent

- name: Remove old Influx GPG key
  file:
    path: /usr/share/keyrings/influxdata-archive.key
    state: absent

- name: Update apt cache safely before adding repo
  apt:
    update_cache: yes

- name: Install dependencies
  apt:
    name:
      - curl
      - gnupg
    state: present

# ✅ Proper modern key installation
- name: Add InfluxData GPG key (modern method)
  shell: |
    curl -fsSL https://repos.influxdata.com/influxdata-archive.key \
    | gpg --dearmor \
    | tee /usr/share/keyrings/influxdata-archive.key > /dev/null
  args:
    executable: /bin/bash

- name: Add InfluxData repository
  copy:
    dest: /etc/apt/sources.list.d/influxdata.list
    content: |
      deb [signed-by=/usr/share/keyrings/influxdata-archive.key] https://repos.influxdata.com/ubuntu jammy stable

- name: Update apt cache after adding repo
  apt:
    update_cache: yes

- name: Install Telegraf
  apt:
    name: telegraf
    state: present

- name: Fail if INFLUX_HOST not set
  fail:
    msg: "INFLUX_HOST environment variable is not set!"
  when: lookup('env','INFLUX_HOST') == ""

- name: Fail if INFLUX_TOKEN not set
  fail:
    msg: "INFLUX_TOKEN environment variable is not set!"
  when: lookup('env','INFLUX_TOKEN') == ""

- name: Deploy Telegraf config
  template:
    src: telegraf.conf.j2
    dest: /etc/telegraf/telegraf.conf
    owner: root
    group: root
    mode: 0644
  notify: restart telegraf

- name: Ensure Telegraf running
  service:
    name: telegraf
    state: started
    enabled: yes
